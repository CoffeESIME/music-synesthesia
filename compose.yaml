name: proyecto-sinestesia

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: proyecto-sinestesia:local
    init: true
    restart: unless-stopped
    environment:
      APP_PORT: "8765"
      HUE_ENABLED: "${HUE_ENABLED:-false}"
      BRIDGE_IP: "${BRIDGE_IP:-}"
      HUE_APPLICATION_KEY: "${HUE_APPLICATION_KEY:-}"
      HUE_LIGHT_IDS: "${HUE_LIGHT_IDS:-}"
      FOCO_2: "${FOCO_2:-}"
      FOCO_3: "${FOCO_3:-}"
      SINESTESIA_HTTPS_PORT: "${SINESTESIA_HTTPS_PORT:-18744}"
    volumes:
      - ./certificates:/app/static/certificates:ro
    ports:
      - "${SINESTESIA_BIND_IP:-0.0.0.0}:${SINESTESIA_HOST_PORT:-18743}:8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/temp:size=512m,mode=1770,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SINESTESIA_LAN_HOST: "${SINESTESIA_LAN_HOST:-127.0.0.1}"
    ports:
      - "${SINESTESIA_BIND_IP:-0.0.0.0}:${SINESTESIA_HTTPS_PORT:-18744}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
